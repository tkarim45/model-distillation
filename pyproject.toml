[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "model-distillation"
version = "0.1.0"
description = "Distill Claude's topic-classification behavior into a local TF-IDF+LogReg student, and measure how much quality survives, what the noisy teacher costs, and when distilling pays off"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Taimour Abdul Karim", email = "taimour.a.karim@gmail.com" }]
keywords = ["distillation", "knowledge-distillation", "llm", "classification", "cost-optimization", "claude", "bedrock"]
dependencies = ["scikit-learn>=1.3", "numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7"]
real = ["anthropic[bedrock]>=0.39"]

[project.scripts]
model-distillation = "distill.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/distill"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
